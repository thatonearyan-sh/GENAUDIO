<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#05080E" />
    </linearGradient>
    <linearGradient id="box" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#0E131A" />
    </linearGradient>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#21262D" />
    </pattern>
  </defs>

  <!-- Canvas Frame -->
  <rect width="920" height="440" rx="10" fill="url(#bg)" stroke="#30363D" stroke-width="1" />
  <rect width="920" height="440" rx="10" fill="url(#dotGrid)" opacity="0.6" />

  <!-- Header -->
  <text x="36" y="38" fill="#F0F6FC" font-family="ui-monospace, monospace" font-size="13" font-weight="700" letter-spacing="1">GENAUDIO // SYSTEM ARCHITECTURE &amp; DATAFLOW</text>
  <text x="36" y="56" fill="#8B949E" font-family="ui-monospace, monospace" font-size="10">Decoupled Three-Tier Architecture: Terminal TUI • DSP Audio Orchestration • Multi-Key Pool Failover</text>

  <!-- COLUMN 1: TUI LAYER -->
  <g transform="translate(36, 80)">
    <rect width="260" height="324" rx="8" fill="url(#box)" stroke="#30363D" stroke-width="1" />
    <path d="M 0 8 C 0 3.58, 3.58 0, 8 0 L 252 0 C 256.42 0, 260 3.58, 260 8 L 260 30 L 0 30 Z" fill="#21262D" />
    <text x="14" y="20" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="11" font-weight="700">1. CONTROLLER &amp; CLI</text>

    <g transform="translate(14, 44)" font-family="ui-monospace, monospace">
      <rect width="232" height="52" rx="5" fill="#0D1117" stroke="#30363D" stroke-width="0.75" />
      <text x="10" y="20" fill="#E6EDF3" font-size="10.5" font-weight="600">genaudio.py (Main TUI)</text>
      <text x="10" y="38" fill="#8B949E" font-size="9.5">Rich Console + InquirerPy Loop</text>

      <g transform="translate(0, 62)">
        <rect width="232" height="52" rx="5" fill="#0D1117" stroke="#30363D" stroke-width="0.75" />
        <text x="10" y="20" fill="#E6EDF3" font-size="10.5" font-weight="600">voice_browser.py</text>
        <text x="10" y="38" fill="#8B949E" font-size="9.5">Library Filter &amp; 5s Local Samples</text>
      </g>

      <g transform="translate(0, 124)">
        <rect width="232" height="52" rx="5" fill="#0D1117" stroke="#30363D" stroke-width="0.75" />
        <text x="10" y="20" fill="#E6EDF3" font-size="10.5" font-weight="600">script_inspector.py</text>
        <text x="10" y="38" fill="#8B949E" font-size="9.5">Word Counter &amp; Pre-flight Quota</text>
      </g>

      <g transform="translate(0, 186)">
        <rect width="232" height="58" rx="5" fill="#0D1117" stroke="#30363D" stroke-width="0.75" />
        <text x="10" y="20" fill="#E6EDF3" font-size="10.5" font-weight="600">tag_injector.py</text>
        <text x="10" y="36" fill="#8B949E" font-size="9.5">v3 Conversational Cue Parser</text>
        <text x="10" y="49" fill="#38BDF8" font-size="8.5">[whispers], [gasps], [laughs]</text>
      </g>
    </g>
  </g>

  <!-- CONNECTOR 1 -> 2 -->
  <line x1="296" y1="242" x2="330" y2="242" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3 3" />
  <polygon points="330,239 335,242 330,245" fill="#38BDF8" />

  <!-- COLUMN 2: AUDIO ENGINE -->
  <g transform="translate(330, 80)">
    <rect width="260" height="324" rx="8" fill="url(#box)" stroke="#30363D" stroke-width="1" />
    <path d="M 0 8 C 0 3.58, 3.58 0, 8 0 L 252 0 C 256.42 0, 260 3.58, 260 8 L 260 30 L 0 30 Z" fill="#21262D" />
    <text x="14" y="20" fill="#818CF8" font-family="ui-monospace, monospace" font-size="11" font-weight="700">2. AUDIO ORCHESTRATION</text>

    <g transform="translate(14, 44)" font-family="ui-monospace, monospace">
      <rect width="232" height="52" rx="5" fill="#0D1117" stroke="#30363D" stroke-width="0.75" />
      <text x="10" y="20" fill="#E6EDF3" font-size="10.5" font-weight="600">dialogue_engine.py</text>
      <text x="10" y="38" fill="#8B949E" font-size="9.5">Multi-Speaker Parsing &amp; Stitching</text>

      <g transform="translate(0, 62)">
        <rect width="232" height="52" rx="5" fill="#0D1117" stroke="#30363D" stroke-width="0.75" />
        <text x="10" y="20" fill="#E6EDF3" font-size="10.5" font-weight="600">long_form_engine.py</text>
        <text x="10" y="38" fill="#8B949E" font-size="9.5">Sentence Splitting + .SRT Subtitles</text>
      </g>

      <g transform="translate(0, 124)">
        <rect width="232" height="52" rx="5" fill="#0D1117" stroke="#30363D" stroke-width="0.75" />
        <text x="10" y="20" fill="#E6EDF3" font-size="10.5" font-weight="600">bgm_mixer.py</text>
        <text x="10" y="38" fill="#8B949E" font-size="9.5">FFmpeg Sidechain Auto-Ducking</text>
      </g>

      <g transform="translate(0, 186)">
        <rect width="232" height="58" rx="5" fill="#0D1117" stroke="#30363D" stroke-width="0.75" />
        <text x="10" y="20" fill="#E6EDF3" font-size="10.5" font-weight="600">audio_processor.py</text>
        <text x="10" y="36" fill="#8B949E" font-size="9.5">atempo Pitch-Preserved Speed</text>
        <text x="10" y="49" fill="#818CF8" font-size="8.5">WAV • FLAC • M4A • EBU R128</text>
      </g>
    </g>
  </g>

  <!-- CONNECTOR 2 -> 3 -->
  <line x1="590" y1="242" x2="624" y2="242" stroke="#818CF8" stroke-width="1.5" stroke-dasharray="3 3" />
  <polygon points="624,239 629,242 624,245" fill="#818CF8" />

  <!-- COLUMN 3: KEY POOL & API -->
  <g transform="translate(624, 80)">
    <rect width="260" height="324" rx="8" fill="url(#box)" stroke="#30363D" stroke-width="1" />
    <path d="M 0 8 C 0 3.58, 3.58 0, 8 0 L 252 0 C 256.42 0, 260 3.58, 260 8 L 260 30 L 0 30 Z" fill="#21262D" />
    <text x="14" y="20" fill="#34D399" font-family="ui-monospace, monospace" font-size="11" font-weight="700">3. KEY POOL &amp; FAILOVER</text>

    <g transform="translate(14, 44)" font-family="ui-monospace, monospace">
      <rect width="232" height="74" rx="5" fill="#0D1117" stroke="#30363D" stroke-width="0.75" />
      <text x="10" y="20" fill="#E6EDF3" font-size="10.5" font-weight="600">account_manager.py</text>
      <text x="10" y="38" fill="#8B949E" font-size="9.5">• Multi-Key Storage (accounts.json)</text>
      <text x="10" y="52" fill="#8B949E" font-size="9.5">• Real-Time Character Quota Telemetry</text>
      <text x="10" y="66" fill="#34D399" font-size="8.5">GET /v1/user/subscription Check</text>

      <g transform="translate(0, 84)">
        <rect width="232" height="74" rx="5" fill="#0D1117" stroke="#30363D" stroke-width="0.75" />
        <text x="10" y="20" fill="#E6EDF3" font-size="10.5" font-weight="600">Smart Load Balancer</text>
        <text x="10" y="38" fill="#8B949E" font-size="9.5">• highest_quota_first Routing</text>
        <text x="10" y="52" fill="#8B949E" font-size="9.5">• Catches HTTP 401 &amp; 429 Quotas</text>
        <text x="10" y="66" fill="#34D399" font-size="8.5">Zero-Drop Mid-Flight Rotation</text>
      </g>

      <g transform="translate(0, 168)">
        <rect width="232" height="76" rx="5" fill="#0D1117" stroke="#30363D" stroke-width="0.75" />
        <text x="10" y="20" fill="#E6EDF3" font-size="10.5" font-weight="600">ElevenLabs API Grid</text>
        <text x="10" y="38" fill="#8B949E" font-size="9.5">• v3 Conversational &amp; Standard</text>
        <text x="10" y="52" fill="#8B949E" font-size="9.5">• Multilingual v2 &amp; Turbo v2.5</text>
        <text x="10" y="66" fill="#8B949E" font-size="8.5">Raw Byte Stream Decoder</text>
      </g>
    </g>
  </g>
</svg>
