    <text x="165" y="44" fill="#EF4444" font-family="monospace" font-size="8.5" text-anchor="middle">DUCKED (-18dB)</text>
    <text x="210" y="10" fill="#10B981" font-family="monospace" font-size="8.5" text-anchor="middle">PAUSE (+0dB)</text>
    <text x="250" y="44" fill="#EF4444" font-family="monospace" font-size="8.5" text-anchor="middle">DUCKED (-18dB)</text>
    <text x="310" y="10" fill="#10B981" font-family="monospace" font-size="8.5" text-anchor="middle">PAUSE (+0dB)</text>
